<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Comparateur d'offres d'emploi</title>
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Mes Offres" />
<meta name="theme-color" content="#1C1C1A" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #FAFAF7; --surface: #fff;
  --ink: #1C1C1A; --ink-2: #5C5B56; --ink-3: #9B9A95;
  --line: #E4E3DC; --line-2: #F0EFE8;
  --ideal: #1A6640; --ideal-bg: #EAF5EE; --ideal-line: #A8D9BA; --ideal-tag: #C9EDD5;
  --accept: #7A4F10; --accept-bg: #FDF4E7; --accept-line: #F0C97A; --accept-tag: #FADDAA;
  --ca: #2E5FAA; --ca-bg: #EBF0FA; --ca-line: #AABFE8;
  --cb: #2D6B4F; --cb-bg: #EBF5F0; --cb-line: #96CDB5;
  --font-serif: 'Fraunces', serif; --font-sans: 'Instrument Sans', sans-serif;
  --r: 8px; --r-lg: 14px;
}
body { background: var(--bg); font-family: var(--font-sans); color: var(--ink); font-size: 14px; line-height: 1.6; min-height: 100vh; }

/* ── Header ── */
.header { background: var(--surface); border-bottom: 1px solid var(--line); padding: 1.5rem 2.5rem; display: flex; align-items: center; justify-content: space-between; gap: 2rem; flex-wrap: wrap; }
.header h1 { font-family: var(--font-serif); font-size: 1.6rem; font-weight: 400; letter-spacing: -0.02em; margin-bottom: 1px; }
.header-sub { font-size: 12.5px; color: var(--ink-3); }

/* ── Steps ── */
.steps { display: flex; align-items: center; gap: 4px; }
.step-item { display: flex; align-items: center; gap: 7px; }
.step-num { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; border: 1.5px solid var(--line); color: var(--ink-3); background: var(--surface); flex-shrink: 0; transition: all 0.2s; }
.step-label { font-size: 12px; color: var(--ink-3); white-space: nowrap; transition: all 0.2s; }
.step-item.active .step-num { background: var(--ink); border-color: var(--ink); color: #fff; }
.step-item.active .step-label { color: var(--ink); font-weight: 500; }
.step-item.done .step-num { background: var(--ideal-bg); border-color: var(--ideal-line); color: var(--ideal); }
.step-item.done .step-label { color: var(--ideal); }
.step-sep { width: 24px; height: 1px; background: var(--line); margin: 0 2px; }

/* ── Main ── */
.main { max-width: 960px; margin: 0 auto; padding: 2.5rem 2rem 7rem; }
.section-intro { margin-bottom: 2.5rem; }
.section-intro h2 { font-family: var(--font-serif); font-size: 1.45rem; font-weight: 300; font-style: italic; margin-bottom: 0.5rem; }
.section-intro p { font-size: 13px; color: var(--ink-2); max-width: 600px; line-height: 1.75; }

/* ── Step 1 ── */
.col-legend { display: grid; grid-template-columns: 220px 1fr 1fr; gap: 12px; margin-bottom: 10px; }
.col-legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.criteria-list { display: flex; flex-direction: column; gap: 10px; }
.criterion-row { display: grid; grid-template-columns: 220px 1fr 1fr; gap: 12px; align-items: stretch; }
.crit-label { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 1rem 1.25rem; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
.crit-name { font-size: 14px; font-weight: 500; color: var(--ink); }
.crit-hint { font-size: 11.5px; color: var(--ink-3); line-height: 1.4; }
.crit-cell { border-radius: var(--r-lg); padding: 1rem 1.125rem; display: flex; flex-direction: column; gap: 8px; }
.crit-cell.ideal-cell { background: var(--ideal-bg); border: 1px solid var(--ideal-line); }
.crit-cell.accept-cell { background: var(--accept-bg); border: 1px solid var(--accept-line); }
.tags-wrap { display: flex; flex-wrap: wrap; gap: 6px; min-height: 28px; align-items: flex-start; }
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 20px; font-size: 12.5px; }
.tag.ideal-tag { background: var(--ideal-tag); color: var(--ideal); }
.tag.accept-tag { background: var(--accept-tag); color: var(--accept); }
.tag-del { cursor: pointer; opacity: 0.5; font-size: 15px; line-height: 1; transition: opacity 0.1s; }
.tag-del:hover { opacity: 1; }
.tags-empty { font-size: 12px; color: var(--ink-3); font-style: italic; }
.quick-picks { display: flex; flex-wrap: wrap; gap: 5px; }
.qpick { padding: 3px 10px; border-radius: 20px; font-size: 12px; border: 1px solid transparent; cursor: pointer; background: transparent; font-family: var(--font-sans); transition: background 0.12s; }
.ideal-cell .qpick { border-color: var(--ideal-line); color: var(--ideal); }
.ideal-cell .qpick:hover { background: var(--ideal-tag); }
.accept-cell .qpick { border-color: var(--accept-line); color: var(--accept); }
.accept-cell .qpick:hover { background: var(--accept-tag); }
.qpick.used { opacity: 0.3; pointer-events: none; }
.free-input-row { display: flex; gap: 6px; }
.free-input { flex: 1; border: 1px solid transparent; border-radius: 6px; padding: 5px 10px; font-size: 16px; font-family: var(--font-sans); color: var(--ink); outline: none; transition: border-color 0.15s; }
.ideal-cell .free-input { background: rgba(255,255,255,0.65); border-color: var(--ideal-line); }
.ideal-cell .free-input:focus { border-color: var(--ideal); }
.accept-cell .free-input { background: rgba(255,255,255,0.65); border-color: var(--accept-line); }
.accept-cell .free-input:focus { border-color: var(--accept); }
.free-input::placeholder { color: var(--ink-3); }
.add-btn { padding: 5px 12px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; font-family: var(--font-sans); transition: background 0.12s; }
.ideal-cell .add-btn { background: var(--ideal); color: #fff; }
.accept-cell .add-btn { background: var(--accept); color: #fff; }

/* ── Step 2 ── */
.offer-names-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 2rem; }
.offer-name-block { border-radius: var(--r-lg); padding: 1rem 1.25rem; display: flex; flex-direction: column; gap: 6px; }
.offer-name-block.offer-a { background: var(--ca-bg); border: 1px solid var(--ca-line); }
.offer-name-block.offer-b { background: var(--cb-bg); border: 1px solid var(--cb-line); }
.offer-name-label { font-size: 11px; font-weight: 500; letter-spacing: 0.07em; text-transform: uppercase; }
.offer-name-block.offer-a .offer-name-label { color: var(--ca); }
.offer-name-block.offer-b .offer-name-label { color: var(--cb); }
.offer-name-input { border: 1px solid transparent; border-radius: var(--r); padding: 7px 11px; font-size: 16px; font-weight: 500; font-family: var(--font-sans); color: var(--ink); width: 100%; outline: none; transition: border-color 0.15s; }
.offer-name-block.offer-a .offer-name-input { background: rgba(255,255,255,0.7); border-color: var(--ca-line); }
.offer-name-block.offer-a .offer-name-input:focus { border-color: var(--ca); }
.offer-name-block.offer-b .offer-name-input { background: rgba(255,255,255,0.7); border-color: var(--cb-line); }
.offer-name-block.offer-b .offer-name-input:focus { border-color: var(--cb); }

.s2-criteria-list { display: flex; flex-direction: column; gap: 10px; }

.s2-row { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.s2-row-head { display: grid; grid-template-columns: 200px 1fr 1fr; gap: 0; border-bottom: 1px solid var(--line-2); }
.s2-crit-info { padding: 0.9rem 1.25rem; border-right: 1px solid var(--line-2); display: flex; flex-direction: column; gap: 3px; }
.s2-crit-name { font-size: 13.5px; font-weight: 500; }
.s2-weight-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.s2-weight-label { font-size: 11px; color: var(--ink-3); }
.weight-select { border: 1px solid var(--line); border-radius: 20px; padding: 2px 8px; font-size: 11.5px; font-family: var(--font-sans); color: var(--ink-2); background: var(--bg); cursor: pointer; outline: none; }
.weight-select:focus { border-color: var(--ink-3); }

.s2-offer-head { padding: 0.75rem 1.25rem; display: flex; align-items: center; justify-content: center; }
.s2-offer-head.head-a { border-right: 1px solid var(--line-2); background: var(--ca-bg); }
.s2-offer-head.head-b { background: var(--cb-bg); }
.s2-offer-name { font-size: 12px; font-weight: 500; }
.s2-offer-head.head-a .s2-offer-name { color: var(--ca); }
.s2-offer-head.head-b .s2-offer-name { color: var(--cb); }

.s2-row-body { display: grid; grid-template-columns: 200px 1fr 1fr; gap: 0; }
.s2-slider-cell { padding: 1rem 1.25rem; display: flex; flex-direction: column; gap: 10px; }
.s2-slider-cell.cell-a { border-right: 1px solid var(--line-2); }

/* 4-state segmented control */
.seg-ctrl { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg-btn { padding: 8px 4px; border: none; background: transparent; font-family: var(--font-sans); font-size: 12px; color: var(--ink-3); cursor: pointer; transition: all 0.12s; border-right: 1px solid var(--line); text-align: center; line-height: 1.3; }
.seg-btn:last-child { border-right: none; }
.seg-btn:hover { background: var(--bg); color: var(--ink); }
.seg-btn .seg-icon { display: block; font-size: 15px; margin-bottom: 2px; }
.seg-btn .seg-lbl { display: block; font-size: 10.5px; }

/* Active states */
.seg-btn.active-unknown { background: #F3F2EF; color: var(--ink-2); font-weight: 500; }
.seg-btn.active-no { background: #FCEAEA; color: #8B2020; font-weight: 500; }
.seg-btn.active-ok { background: var(--accept-bg); color: var(--accept); font-weight: 500; }
.seg-btn.active-ideal { background: var(--ideal-bg); color: var(--ideal); font-weight: 500; }

/* Condition reminder */
.cond-reminder { font-size: 11px; color: var(--ink-3); line-height: 1.5; }
.cond-reminder span { display: inline-block; border-radius: 10px; padding: 1px 7px; font-size: 10.5px; margin: 1px 2px; }
.cond-reminder .cr-ideal { background: var(--ideal-tag); color: var(--ideal); }
.cond-reminder .cr-accept { background: var(--accept-tag); color: var(--accept); }
.cond-reminder .cr-none { color: var(--ink-3); font-style: italic; }

/* Score bar */
.s2-score-bar { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 1.25rem 1.5rem; margin-top: 1.5rem; }
.score-bar-title { font-size: 11px; font-weight: 500; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 1rem; }
.score-bar-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
.score-offer { display: flex; flex-direction: column; gap: 6px; }
.score-offer-name { font-size: 12px; font-weight: 500; }
.score-offer-name.name-a { color: var(--ca); }
.score-offer-name.name-b { color: var(--cb); }
.score-track { height: 8px; background: var(--line-2); border-radius: 4px; overflow: hidden; }
.score-fill { height: 100%; border-radius: 4px; transition: width 0.35s ease; }
.score-fill.fill-a { background: var(--ca); }
.score-fill.fill-b { background: var(--cb); }
.score-num { font-family: var(--font-serif); font-size: 1.5rem; font-weight: 400; }
.score-num.num-a { color: var(--ca); }
.score-num.num-b { color: var(--cb); }
.score-detail { font-size: 11px; color: var(--ink-3); margin-top: 2px; }

/* Spacer in s2-crit-info (left col same height as body) */
.s2-crit-info { justify-content: center; }

/* ── Footer ── */
.footer-cta { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 1rem 2.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.cta-hint { font-size: 13px; color: var(--ink-3); }
.cta-hint strong { color: var(--ink); font-weight: 500; }
.cta-btn { padding: 10px 26px; border-radius: var(--r); border: none; background: var(--ink); color: #fff; font-family: var(--font-sans); font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.15s; opacity: 0.35; pointer-events: none; }
.cta-btn.ready { opacity: 1; pointer-events: all; }
.cta-btn.ready:hover { background: #333330; }
.back-btn { padding: 10px 20px; border-radius: var(--r); border: 1px solid var(--line); background: transparent; font-family: var(--font-sans); font-size: 13px; color: var(--ink-2); cursor: pointer; transition: all 0.15s; }
.back-btn:hover { background: var(--bg); }

/* ── Recap ── */
.recap-wrap { max-width: 600px; margin: 0 auto; text-align: center; padding: 3rem 1rem; }
.recap-check { font-size: 2.5rem; margin-bottom: 1rem; }
.recap-title { font-family: var(--font-serif); font-size: 1.5rem; font-weight: 300; font-style: italic; margin-bottom: 0.75rem; }
.recap-desc { font-size: 13px; color: var(--ink-2); line-height: 1.7; margin-bottom: 2rem; }
.recap-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 1.5rem; text-align: left; }
.recap-card-title { font-size: 11px; font-weight: 500; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 1.25rem; }
.recap-crit { margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--line-2); }
.recap-crit:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.recap-crit-name { font-size: 13px; font-weight: 500; margin-bottom: 6px; }
.recap-row { margin-bottom: 4px; }
.recap-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500; margin-right: 4px; }
.rtag { display: inline-block; border-radius: 20px; padding: 2px 9px; font-size: 12px; margin: 2px; }
.rtag.ideal-tag { background: var(--ideal-tag); color: var(--ideal); }
.rtag.accept-tag { background: var(--accept-tag); color: var(--accept); }

/* ── Step 3 ── */
.s3-series-block { margin-bottom: 2.5rem; }
.s3-series-title { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
.s3-series-badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 10.5px; font-weight: 500; letter-spacing: 0.05em; }
.badge-a { background: #EEF0F5; color: #4A5568; }
.badge-b { background: #F3EEF5; color: #6B4F7A; }
.badge-c { background: #EEF5F0; color: #3A6040; }

.s3-question-row { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; margin-bottom: 10px; }
.s3-q-head { background: var(--bg); border-bottom: 1px solid var(--line-2); padding: 0.75rem 1.25rem; }
.s3-q-text { font-size: 13.5px; color: var(--ink); line-height: 1.5; }

.s3-q-body { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
.s3-q-cell { padding: 0.875rem 1.25rem; display: flex; flex-direction: column; gap: 6px; }
.s3-q-cell.cell-a { border-right: 1px solid var(--line-2); }
.s3-q-cell-label { font-size: 11px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; }
.s3-q-cell.cell-a .s3-q-cell-label { color: var(--ca); }
.s3-q-cell.cell-b .s3-q-cell-label { color: var(--cb); }
.s3-textarea { width: 100%; border: 1px solid var(--line); border-radius: var(--r); padding: 8px 12px; font-size: 16px; font-family: var(--font-sans); color: var(--ink); background: var(--bg); resize: vertical; min-height: 72px; line-height: 1.6; outline: none; transition: border-color 0.15s; }
.s3-q-cell.cell-a .s3-textarea:focus { border-color: var(--ca); background: var(--ca-bg); }
.s3-q-cell.cell-b .s3-textarea:focus { border-color: var(--cb); background: var(--cb-bg); }
.s3-textarea::placeholder { color: var(--ink-3); font-style: italic; }

.s3-offer-col-heads { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin-bottom: 10px; border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.s3-col-head { padding: 0.75rem 1.25rem; text-align: center; font-size: 12px; font-weight: 500; }
.s3-col-head.head-a { background: var(--ca-bg); color: var(--ca); border-right: 1px solid var(--line-2); }
.s3-col-head.head-b { background: var(--cb-bg); color: var(--cb); }

.s3-progress { font-size: 12px; color: var(--ink-3); margin-bottom: 1.5rem; }
.s3-progress strong { color: var(--ink); }

/* ── Step 4 — Synthèse portraits ── */
.s4-portrait-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 1.5rem; }
.s4-portrait-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.s4-portrait-header { padding: 1.25rem 1.5rem 1rem; border-bottom: 1px solid var(--line); }
.s4-portrait-header.hdr-a { border-top: 3px solid var(--ca); }
.s4-portrait-header.hdr-b { border-top: 3px solid var(--cb); }
.s4-offer-label { font-size: 11px; font-weight: 500; letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 4px; }
.s4-portrait-header.hdr-a .s4-offer-label { color: var(--ca); }
.s4-portrait-header.hdr-b .s4-offer-label { color: var(--cb); }
.s4-offer-subtitle { font-family: var(--font-serif); font-size: 1.2rem; font-weight: 300; font-style: italic; color: var(--ink); line-height: 1.35; margin-bottom: 10px; min-height: 2em; }
.s4-score-row { display: flex; align-items: center; gap: 10px; }
.s4-score-num { font-family: var(--font-serif); font-size: 1.75rem; font-weight: 300; }
.s4-portrait-header.hdr-a .s4-score-num { color: var(--ca); }
.s4-portrait-header.hdr-b .s4-score-num { color: var(--cb); }
.s4-score-track { flex: 1; height: 5px; background: var(--line); border-radius: 3px; }
.s4-score-fill { height: 5px; border-radius: 3px; transition: width 0.4s ease; }
.s4-portrait-header.hdr-a .s4-score-fill { background: var(--ca); }
.s4-portrait-header.hdr-b .s4-score-fill { background: var(--cb); }
.s4-score-detail { font-size: 11px; color: var(--ink-3); margin-top: 3px; }

.s4-portrait-body { padding: 1rem 1.5rem; }
.s4-psection { margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--line-2); }
.s4-psection:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.s4-psection-label { font-size: 10.5px; font-weight: 500; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 7px; }
.s4-ptags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 0; }
.s4-ptag { font-size: 11.5px; padding: 3px 10px; border-radius: 20px; }
.s4-ptag-ideal { background: var(--ideal-tag); color: var(--ideal); }
.s4-ptag-ok { background: var(--accept-tag); color: var(--accept); }
.s4-ptag-no { background: #FCEAEA; color: #8B2020; }
.s4-ptag-unknown { background: var(--line-2); color: var(--ink-3); }
.s4-quote { font-size: 12.5px; color: var(--ink-2); line-height: 1.7; font-style: italic; border-left: 2px solid var(--line); padding-left: 10px; }
.s4-quote-empty { font-size: 12px; color: var(--ink-3); font-style: italic; }
.s4-feeling-row { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 6px; }
.s4-feeling-row:last-child { margin-bottom: 0; }
.s4-feeling-icon { width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; flex-shrink: 0; margin-top: 1px; }
.s4-feeling-icon.pos { background: var(--ideal-tag); color: var(--ideal); }
.s4-feeling-icon.neg { background: #FCEAEA; color: #8B2020; }
.s4-feeling-icon.neu { background: var(--line-2); color: var(--ink-3); }
.s4-feeling-text { font-size: 12.5px; color: var(--ink-2); line-height: 1.55; }

.s4-signal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 1.25rem 1.5rem; text-align: center; margin-bottom: 1.5rem; }
.s4-signal-label { font-size: 11px; font-weight: 500; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
.s4-signal-text { font-family: var(--font-serif); font-size: 1.3rem; font-weight: 300; font-style: italic; }

.s4-notes { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 1.25rem 1.5rem; }
.s4-notes-label { font-size: 11px; font-weight: 500; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
.s4-notes-ta { width: 100%; border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; font-size: 16px; font-family: var(--font-sans); color: var(--ink); background: var(--bg); resize: vertical; min-height: 100px; line-height: 1.7; outline: none; transition: border-color 0.15s; }
.s4-notes-ta:focus { border-color: var(--ink-3); }
.s4-notes-ta::placeholder { color: var(--ink-3); font-style: italic; }

@media (max-width: 720px) {
  /* ── Layout général ── */
  .header { padding: 1rem 1.25rem; flex-direction: column; align-items: flex-start; gap: 1rem; }
  .header h1 { font-size: 1.4rem; }
  .main { padding: 1.25rem 1rem 8rem; }

  /* ── Steps : icônes seules sur mobile ── */
  .steps { flex-wrap: nowrap; overflow-x: auto; gap: 4px; width: 100%; padding-bottom: 2px; }
  .step-label { display: none; }
  .step-sep { width: 16px; flex-shrink: 0; }
  .step-num { width: 32px; height: 32px; font-size: 13px; }

  /* ── Footer ── */
  .footer-cta { flex-direction: column; align-items: stretch; padding: 0.875rem 1rem; gap: 8px; }
  .cta-btn { justify-content: center; padding: 13px; font-size: 15px; }
  .back-btn { text-align: center; padding: 11px; }
  .cta-hint { text-align: center; font-size: 12px; }

  /* ── Step 1 ── */
  .col-legend { grid-template-columns: 1fr; gap: 6px; }
  .col-legend > div:first-child { display: none; }
  .criterion-row { grid-template-columns: 1fr; gap: 8px; }
  .crit-label { border-radius: var(--r); padding: 0.75rem 1rem; }
  .crit-name { font-size: 15px; }
  .crit-cell { border-radius: var(--r); padding: 0.875rem 1rem; }
  .qpick { padding: 5px 12px; font-size: 13px; }
  .free-input { font-size: 14px; padding: 8px 10px; }
  .add-btn { padding: 8px 14px; font-size: 14px; }
  .tag { font-size: 13px; padding: 4px 12px; }

  /* ── Step 2 ── */
  .offer-names-row { grid-template-columns: 1fr; gap: 10px; }
  .s2-row-head { grid-template-columns: 1fr; }
  .s2-row-body { grid-template-columns: 1fr; }
  .s2-crit-info { border-right: none; border-bottom: 1px solid var(--line-2); padding: 0.875rem 1rem; }
  .s2-offer-head.head-a { border-right: none; border-bottom: 1px solid var(--line-2); }
  .s2-offer-head { padding: 0.625rem 1rem; justify-content: flex-start; }
  .s2-offer-name { font-size: 13px; }
  .s2-slider-cell { padding: 0.875rem 1rem; }
  .s2-slider-cell.cell-a { border-right: none; border-bottom: 1px solid var(--line-2); }
  .seg-ctrl { grid-template-columns: repeat(4, 1fr); }
  .seg-btn { padding: 10px 4px; font-size: 12px; }
  .seg-btn .seg-icon { font-size: 16px; }
  .seg-btn .seg-lbl { font-size: 10px; }
  .score-bar-row { grid-template-columns: 1fr; gap: 1rem; }
  .s2-score-bar { padding: 1rem; }

  /* ── Step 3 ── */
  .s3-offer-col-heads { grid-template-columns: 1fr 1fr; }
  .s3-col-head { padding: 0.625rem 0.75rem; font-size: 11px; }
  .s3-q-body { grid-template-columns: 1fr; }
  .s3-q-cell.cell-a { border-right: none; border-bottom: 1px solid var(--line-2); }
  .s3-q-head { padding: 0.75rem 1rem; }
  .s3-q-text { font-size: 13px; }
  .s3-q-cell { padding: 0.75rem 1rem; }
  .s3-textarea { min-height: 80px; font-size: 14px; }

  /* ── Step 4 ── */
  .s4-portrait-cols { grid-template-columns: 1fr; gap: 12px; }
  .s4-portrait-header { padding: 1rem 1.25rem 0.875rem; }
  .s4-offer-subtitle { font-size: 1.05rem; }
  .s4-score-num { font-size: 1.5rem; }
  .s4-portrait-body { padding: 0.875rem 1.25rem; }
  .s4-signal { padding: 1rem 1.25rem; }
  .s4-signal-text { font-size: 1.1rem; }
  .s4-notes { padding: 1rem 1.25rem; }
  .s4-notes-ta { font-size: 14px; min-height: 80px; }
  .s4-ptag { font-size: 12px; padding: 4px 10px; }
  .s4-feeling-text { font-size: 13px; }
  .s4-quote { font-size: 13px; }

  /* ── Section intro ── */
  .section-intro h2 { font-size: 1.25rem; }
  .section-intro p { font-size: 13px; }
}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>Outil de décision</h1>
    <div class="header-sub">Compare deux offres d'emploi en 4 étapes</div>
  </div>
  <div class="steps" id="steps-bar">
    <div class="step-item active"><div class="step-num">1</div><div class="step-label">Mes conditions</div></div>
    <div class="step-sep"></div>
    <div class="step-item"><div class="step-num">2</div><div class="step-label">Positionnement</div></div>
    <div class="step-sep"></div>
    <div class="step-item"><div class="step-num">3</div><div class="step-label">Analyse des offres</div></div>
    <div class="step-sep"></div>
    <div class="step-item"><div class="step-num">4</div><div class="step-label">Synthèse</div></div>
  </div>
</div>

<div class="main" id="main-area"></div>

<div class="footer-cta" id="footer-cta">
  <p class="cta-hint" id="cta-hint">Remplis au moins 3 critères pour continuer.</p>
  <button class="cta-btn" id="cta-btn">
    Passer à l'étape 2
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</div>

<script>
/* ═══════════════════════════════════════
   DATA
═══════════════════════════════════════ */
var criteria = [
  { id: 'remuneration', name: 'Rémunération', hint: 'Salaire fixe, variable, avantages…',
    idealPicks: ['Moins de 40k€','40–50k€','50–60k€','60–75k€','75–90k€','Plus de 90k€','Package à négocier'],
    acceptPicks: ['Moins de 40k€','40–50k€','50–60k€','60–75k€','75–90k€','Plus de 90k€','Variable selon avantages'] },
  { id: 'rythme', name: 'Rythme de travail', hint: 'Nombre de jours par semaine',
    idealPicks: ['3/5','4/5','Temps plein 5/5','Forfait jours','Temps partiel choisi'],
    acceptPicks: ['3/5','4/5','Temps plein 5/5','Forfait jours','Flexible selon période'] },
  { id: 'teletravail', name: 'Télétravail', hint: 'Organisation présentiel / distanciel',
    idealPicks: ['Full remote','4j/sem TT','3j/sem TT','2j/sem TT','Hybride flexible','Présentiel'],
    acceptPicks: ['Full remote','4j/sem TT','3j/sem TT','2j/sem TT','Hybride flexible','Présentiel'] },
  { id: 'contrat', name: 'Type de contrat', hint: 'Statut, durée, encadrement juridique',
    idealPicks: ['CDI','CDD','Freelance','Portage salarial','Associé'],
    acceptPicks: ['CDI','CDD','Freelance','Portage salarial','CDI avec longue période essai'] },
  { id: 'deplacements', name: 'Déplacements', hint: 'Fréquence et nature des déplacements',
    idealPicks: ['Aucun','Occasionnels (moins 1/mois)','Réguliers (1–2/mois)','Fréquents (plus 2/mois)','International ok'],
    acceptPicks: ['Aucun','Occasionnels (moins 1/mois)','Réguliers (1–2/mois)','Fréquents si remboursés','International si planifié'] },
  { id: 'geo', name: 'Situation géographique', hint: 'Localisation, mobilité',
    idealPicks: ['Paris intramuros','Petite couronne','Grande couronne','Province ok','Étranger ok','Peu importe (remote)'],
    acceptPicks: ['Paris intramuros','Petite couronne','Grande couronne','Province si TT majoritaire','Peu importe (remote)'] }
];

/* ═══════════════════════════════════════
   STATE
═══════════════════════════════════════ */
var s1 = {};  // step1: { id: { ideal:[], accept:[] } }
criteria.forEach(function(c){ s1[c.id] = { ideal:[], accept:[] }; });

var s2 = {
  nameA: 'Offre A',
  nameB: 'Offre B',
  scores: {}   // { id: { a: 'unknown'|'no'|'ok'|'ideal', b: ... , weight: 'low'|'mid'|'high' } }
};
criteria.forEach(function(c){
  s2.scores[c.id] = { a: 'unknown', b: 'unknown', weight: 'mid' };
});

var currentStep = 1;

/* ═══════════════════════════════════════
   STEP NAV
═══════════════════════════════════════ */
function setStepUI(activeIdx) {
  var items = document.querySelectorAll('.step-item');
  items.forEach(function(el, i) {
    el.className = 'step-item' + (i < activeIdx ? ' done' : i === activeIdx ? ' active' : '');
    var num = el.querySelector('.step-num');
    num.textContent = i < activeIdx ? '✓' : (i + 1);
  });
}

/* ═══════════════════════════════════════
   STEP 1 — CONDITIONS
═══════════════════════════════════════ */
function renderStep1() {
  currentStep = 1;
  setStepUI(0);
  var main = document.getElementById('main-area');
  main.innerHTML = '';

  var intro = document.createElement('div');
  intro.className = 'section-intro';
  intro.innerHTML = '<h2>Avant de regarder les offres, clarifie ce que tu veux vraiment.</h2>' +
    '<p>Pour chaque critère, définis ta condition <strong style="color:var(--ideal)">idéale</strong> et ce qui serait <strong style="color:var(--accept)">potentiellement acceptable</strong> si l\'offre est convaincante par ailleurs.</p>';
  main.appendChild(intro);

  var legend = document.createElement('div');
  legend.className = 'col-legend';
  legend.innerHTML = '<div></div>' +
    '<div class="col-legend-item"><div class="legend-dot" style="background:var(--ideal)"></div><span style="color:var(--ideal)">Condition idéale</span></div>' +
    '<div class="col-legend-item"><div class="legend-dot" style="background:var(--accept)"></div><span style="color:var(--accept)">Potentiellement acceptable</span></div>';
  main.appendChild(legend);

  var list = document.createElement('div');
  list.className = 'criteria-list';
  criteria.forEach(function(c) {
    var row = document.createElement('div');
    row.className = 'criterion-row';
    var lbl = document.createElement('div');
    lbl.className = 'crit-label';
    lbl.innerHTML = '<div class="crit-name">' + c.name + '</div><div class="crit-hint">' + c.hint + '</div>';
    row.appendChild(lbl);
    row.appendChild(buildS1Cell(c, 'ideal'));
    row.appendChild(buildS1Cell(c, 'accept'));
    list.appendChild(row);
  });
  main.appendChild(list);

  var footer = document.getElementById('footer-cta');
  footer.innerHTML = '';
  var hint = document.createElement('p');
  hint.className = 'cta-hint';
  hint.id = 'cta-hint';
  footer.appendChild(hint);
  var btn = document.createElement('button');
  btn.className = 'cta-btn';
  btn.id = 'cta-btn';
  btn.innerHTML = 'Passer à l\'étape 2 <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  btn.addEventListener('click', function() { if (btn.classList.contains('ready')) renderStep2(); });
  footer.appendChild(btn);

  updateS1CTA();
}

function buildS1Cell(c, type) {
  var isIdeal = type === 'ideal';
  var cell = document.createElement('div');
  cell.className = 'crit-cell ' + (isIdeal ? 'ideal-cell' : 'accept-cell');

  var tagsWrap = document.createElement('div');
  tagsWrap.className = 'tags-wrap';
  tagsWrap.id = 'tags_' + c.id + '_' + type;
  renderS1Tags(tagsWrap, c.id, type);
  cell.appendChild(tagsWrap);

  var picks = document.createElement('div');
  picks.className = 'quick-picks';
  var pickList = isIdeal ? c.idealPicks : c.acceptPicks;
  pickList.forEach(function(p) {
    var btn = document.createElement('button');
    btn.className = 'qpick' + (s1[c.id][type].indexOf(p) >= 0 ? ' used' : '');
    btn.textContent = p;
    btn.addEventListener('click', (function(cid, t, val){ return function(){ addS1Tag(cid, t, val); }; })(c.id, type, p));
    picks.appendChild(btn);
  });
  cell.appendChild(picks);

  var freeRow = document.createElement('div');
  freeRow.className = 'free-input-row';
  var inp = document.createElement('input');
  inp.type = 'text';
  inp.className = 'free-input';
  inp.placeholder = isIdeal ? 'Autre valeur idéale…' : 'Autre valeur acceptable…';
  inp.id = 'input_' + c.id + '_' + type;
  inp.addEventListener('keydown', (function(cid, t){ return function(e){ if(e.key==='Enter'){e.preventDefault();addS1Free(cid,t);} }; })(c.id, type));
  var addB = document.createElement('button');
  addB.className = 'add-btn';
  addB.textContent = '+';
  addB.addEventListener('click', (function(cid, t){ return function(){ addS1Free(cid,t); }; })(c.id, type));
  freeRow.appendChild(inp);
  freeRow.appendChild(addB);
  cell.appendChild(freeRow);
  return cell;
}

function renderS1Tags(container, id, type) {
  container.innerHTML = '';
  var tags = s1[id][type];
  if (!tags.length) {
    var em = document.createElement('span');
    em.className = 'tags-empty';
    em.textContent = 'Rien de défini pour instant';
    container.appendChild(em);
    return;
  }
  var cls = type === 'ideal' ? 'ideal-tag' : 'accept-tag';
  tags.forEach(function(t, ti) {
    var span = document.createElement('span');
    span.className = 'tag ' + cls;
    span.textContent = t + ' ';
    var del = document.createElement('span');
    del.className = 'tag-del';
    del.textContent = '×';
    del.addEventListener('click', (function(cid, tp, idx){ return function(){ removeS1Tag(cid,tp,idx); }; })(id, type, ti));
    span.appendChild(del);
    container.appendChild(span);
  });
}

function addS1Tag(id, type, val) {
  if (s1[id][type].indexOf(val) >= 0) return;
  s1[id][type].push(val);
  var wrap = document.getElementById('tags_' + id + '_' + type);
  if (wrap) {
    renderS1Tags(wrap, id, type);
    wrap.parentNode.querySelectorAll('.qpick').forEach(function(b){ if(b.textContent===val) b.classList.add('used'); });
  }
  updateS1CTA();
}

function removeS1Tag(id, type, idx) {
  var val = s1[id][type][idx];
  s1[id][type].splice(idx, 1);
  var wrap = document.getElementById('tags_' + id + '_' + type);
  if (wrap) { renderS1Tags(wrap, id, type); wrap.parentNode.querySelectorAll('.qpick').forEach(function(b){ if(b.textContent===val) b.classList.remove('used'); }); }
  updateS1CTA();
}

function addS1Free(id, type) {
  var inp = document.getElementById('input_' + id + '_' + type);
  if (!inp) return;
  var val = inp.value.trim();
  if (!val) return;
  if (s1[id][type].indexOf(val) < 0) {
    s1[id][type].push(val);
    var wrap = document.getElementById('tags_' + id + '_' + type);
    if (wrap) renderS1Tags(wrap, id, type);
    updateS1CTA();
  }
  inp.value = '';
  inp.focus();
}

function countS1Filled() {
  var n = 0;
  criteria.forEach(function(c){ if (s1[c.id].ideal.length || s1[c.id].accept.length) n++; });
  return n;
}

function updateS1CTA() {
  var filled = countS1Filled();
  var btn = document.getElementById('cta-btn');
  var hint = document.getElementById('cta-hint');
  if (!btn || !hint) return;
  if (filled >= 3) {
    btn.classList.add('ready');
    hint.innerHTML = '<strong>' + filled + ' critère' + (filled>1?'s':'') + '</strong> défini' + (filled>1?'s':'') + ' — tu peux continuer.';
  } else {
    btn.classList.remove('ready');
    var rem = 3 - filled;
    hint.innerHTML = 'Définis encore <strong>' + rem + ' critère' + (rem>1?'s':'') + '</strong> pour continuer.';
  }
}

/* ═══════════════════════════════════════
   STEP 2 — POSITIONNEMENT
═══════════════════════════════════════ */
var LEVELS = [
  { val: 'unknown', icon: '?', lbl: 'Je ne sais pas', activeClass: 'active-unknown' },
  { val: 'no',      icon: '✗', lbl: 'Inacceptable',   activeClass: 'active-no' },
  { val: 'ok',      icon: '~', lbl: 'Acceptable',      activeClass: 'active-ok' },
  { val: 'ideal',   icon: '✓', lbl: 'Idéal',           activeClass: 'active-ideal' }
];
var WEIGHTS = { low: 1, mid: 2, high: 3 };
var SCORE_VAL = { unknown: null, no: 0, ok: 1, ideal: 2 };

function renderStep2() {
  currentStep = 2;
  setStepUI(1);
  var main = document.getElementById('main-area');
  main.innerHTML = '';

  // Intro
  var intro = document.createElement('div');
  intro.className = 'section-intro';
  intro.innerHTML = '<h2>Comment chaque offre se positionne par rapport à tes conditions ?</h2>' +
    '<p>Pour chaque critère, indique si l\'offre est <strong style="color:#8B2020">inacceptable</strong>, <strong style="color:var(--accept)">acceptable</strong> ou <strong style="color:var(--ideal)">idéale</strong>. Règle aussi l\'importance de chaque critère. Le score global se calcule automatiquement.</p>';
  main.appendChild(intro);

  // Offer name inputs
  var namesRow = document.createElement('div');
  namesRow.className = 'offer-names-row';

  ['a','b'].forEach(function(o) {
    var block = document.createElement('div');
    block.className = 'offer-name-block offer-' + o;
    var lbl = document.createElement('div');
    lbl.className = 'offer-name-label';
    lbl.textContent = 'Nom de l\'offre ' + o.toUpperCase();
    var inp = document.createElement('input');
    inp.type = 'text';
    inp.className = 'offer-name-input';
    inp.value = o === 'a' ? s2.nameA : s2.nameB;
    inp.placeholder = 'Offre ' + o.toUpperCase();
    inp.addEventListener('input', (function(offer){ return function(){ if(offer==='a') s2.nameA=this.value||'Offre A'; else s2.nameB=this.value||'Offre B'; refreshS2Names(); refreshS3Names(); }; })(o));
    block.appendChild(lbl);
    block.appendChild(inp);
    namesRow.appendChild(block);
  });
  main.appendChild(namesRow);

  // Criteria rows
  var list = document.createElement('div');
  list.className = 's2-criteria-list';
  criteria.forEach(function(c) { list.appendChild(buildS2Row(c)); });
  main.appendChild(list);

  // Score bar
  main.appendChild(buildScoreBar());

  // Footer
  var footer = document.getElementById('footer-cta');
  footer.innerHTML = '';

  var backBtn = document.createElement('button');
  backBtn.className = 'back-btn';
  backBtn.textContent = '← Retour étape 1';
  backBtn.addEventListener('click', renderStep1);
  footer.appendChild(backBtn);

  var right = document.createElement('div');
  right.style.display = 'flex';
  right.style.alignItems = 'center';
  right.style.gap = '12px';

  var hint = document.createElement('p');
  hint.className = 'cta-hint';
  hint.id = 'cta-hint';
  hint.innerHTML = 'Renseigne au moins 3 critères pour continuer.';
  right.appendChild(hint);

  var btn = document.createElement('button');
  btn.className = 'cta-btn';
  btn.id = 'cta-btn';
  btn.innerHTML = 'Passer à l\'étape 3 <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  btn.addEventListener('click', function() { if (btn.classList.contains('ready')) renderStep3(); });
  right.appendChild(btn);
  footer.appendChild(right);

  updateS2CTA();
}

function buildS2Row(c) {
  var wrap = document.createElement('div');
  wrap.className = 's2-row';
  wrap.id = 's2row_' + c.id;

  // Head row: crit info | offer A head | offer B head
  var head = document.createElement('div');
  head.className = 's2-row-head';

  var info = document.createElement('div');
  info.className = 's2-crit-info';

  var nameEl = document.createElement('div');
  nameEl.className = 's2-crit-name';
  nameEl.textContent = c.name;
  info.appendChild(nameEl);

  // Weight selector
  var weightRow = document.createElement('div');
  weightRow.className = 's2-weight-row';
  var wLbl = document.createElement('span');
  wLbl.className = 's2-weight-label';
  wLbl.textContent = 'Importance :';
  var sel = document.createElement('select');
  sel.className = 'weight-select';
  [['low','Peu important'],['mid','Important'],['high','Essentiel']].forEach(function(opt) {
    var o = document.createElement('option');
    o.value = opt[0];
    o.textContent = opt[1];
    if (s2.scores[c.id].weight === opt[0]) o.selected = true;
    sel.appendChild(o);
  });
  sel.addEventListener('change', (function(cid){ return function(){ s2.scores[cid].weight = this.value; refreshScoreBar(); }; })(c.id));
  weightRow.appendChild(wLbl);
  weightRow.appendChild(sel);
  info.appendChild(weightRow);
  head.appendChild(info);

  ['a','b'].forEach(function(o) {
    var h = document.createElement('div');
    h.className = 's2-offer-head head-' + o;
    var n = document.createElement('div');
    n.className = 's2-offer-name';
    n.id = 's2name_' + o + '_' + c.id;
    n.textContent = o === 'a' ? s2.nameA : s2.nameB;
    h.appendChild(n);
    head.appendChild(h);
  });
  wrap.appendChild(head);

  // Body: crit reminder | offer A controls | offer B controls
  var body = document.createElement('div');
  body.className = 's2-row-body';

  // Condition reminder (left col)
  var reminder = document.createElement('div');
  reminder.className = 's2-slider-cell';
  reminder.style.borderRight = '1px solid var(--line-2)';
  reminder.style.background = 'var(--bg)';
  var remHtml = '<div class="cond-reminder">';
  if (s1[c.id].ideal.length) {
    remHtml += '<div style="margin-bottom:3px;"><span style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ideal);font-weight:500;">Idéal : </span>';
    s1[c.id].ideal.forEach(function(t){ remHtml += '<span class="cr-ideal">' + t + '</span>'; });
    remHtml += '</div>';
  }
  if (s1[c.id].accept.length) {
    remHtml += '<div><span style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--accept);font-weight:500;">Acceptable : </span>';
    s1[c.id].accept.forEach(function(t){ remHtml += '<span class="cr-accept">' + t + '</span>'; });
    remHtml += '</div>';
  }
  if (!s1[c.id].ideal.length && !s1[c.id].accept.length) {
    remHtml += '<span class="cr-none">Aucune condition définie</span>';
  }
  remHtml += '</div>';
  reminder.innerHTML = remHtml;
  body.appendChild(reminder);

  ['a','b'].forEach(function(o) {
    var cell = document.createElement('div');
    cell.className = 's2-slider-cell' + (o==='a' ? ' cell-a' : '');

    var seg = document.createElement('div');
    seg.className = 'seg-ctrl';
    seg.id = 'seg_' + c.id + '_' + o;

    LEVELS.forEach(function(lv) {
      var btn = document.createElement('button');
      btn.className = 'seg-btn' + (s2.scores[c.id][o] === lv.val ? ' ' + lv.activeClass : '');
      btn.innerHTML = '<span class="seg-icon">' + lv.icon + '</span><span class="seg-lbl">' + lv.lbl + '</span>';
      btn.addEventListener('click', (function(cid, offer, level){ return function(){
        s2.scores[cid][offer] = level.val;
        var segEl = document.getElementById('seg_' + cid + '_' + offer);
        segEl.querySelectorAll('.seg-btn').forEach(function(b, i){ b.className = 'seg-btn' + (LEVELS[i].val === level.val ? ' ' + level.activeClass : ''); });
        refreshScoreBar();
        updateS2CTA();
      }; })(c.id, o, lv));
      seg.appendChild(btn);
    });

    body.appendChild(cell);

function computeScore(offer) {
  var total = 0, max = 0, answered = 0;
  criteria.forEach(function(c) {
    var w = WEIGHTS[s2.scores[c.id].weight];
    var v = SCORE_VAL[s2.scores[c.id][offer]];
    if (v !== null) { total += v * w; answered++; }
    max += 2 * w;
  });
  if (!answered) return null;
  return { pct: Math.round((total / max) * 100), answered: answered };
}

function refreshScoreBar() {
  ['a','b'].forEach(function(o) {
    var res = computeScore(o);
    var fillEl = document.getElementById('score-fill-' + o);
    var numEl = document.getElementById('score-num-' + o);
    var detEl = document.getElementById('score-detail-' + o);
    var nameEl = document.getElementById('score-name-' + o);
    if (nameEl) nameEl.textContent = o === 'a' ? s2.nameA : s2.nameB;
    if (!res) {
      if (fillEl) fillEl.style.width = '0%';
      if (numEl) numEl.textContent = '–';
      if (detEl) detEl.textContent = '';
    } else {
      if (fillEl) fillEl.style.width = res.pct + '%';
      if (numEl) numEl.textContent = res.pct + '%';
      if (detEl) detEl.textContent = res.answered + '/' + criteria.length + ' critères renseignés';
    }
  });
}

  if (!hasStrat) {
    var empty = document.createElement('div');
    empty.className = 's4-quote-empty';
    empty.textContent = 'Réflexion stratégique non renseignée.';
    wrap.appendChild(empty);
  }
  return wrap;
}

function buildSignal() {
  var ra = computeScore('a');
  var rb = computeScore('b');
  var div = document.createElement('div');
  div.className = 's4-signal';
  div.innerHTML = '<div class="s4-signal-label">Signal le plus fort</div>';
  var txt = document.createElement('div');
  txt.className = 's4-signal-text';

  if (!ra && !rb) {
    txt.textContent = 'Pas encore assez de données pour comparer.';
    txt.style.color = 'var(--ink-3)';
  } else if (!rb || (ra && ra.pct > rb.pct)) {
    txt.textContent = s2.nameA + ' — mieux alignée sur tes critères';
    txt.style.color = 'var(--ca)';
  } else if (!ra || rb.pct > ra.pct) {
    txt.textContent = s2.nameB + ' — mieux alignée sur tes critères';
    txt.style.color = 'var(--cb)';
  } else {
    txt.textContent = 'Les deux offres sont à égalité — le ressenti est décisif.';
    txt.style.color = 'var(--ink-2)';
  }
  div.appendChild(txt);
  return div;
}

renderStep1();
